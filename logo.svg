<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Abadir Supermarket">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7d33"/>
      <stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#a)"/>
  <!-- shopping basket outline -->
  <path d="M18 27h28l-3.2 18.5a4 4 0 0 1-4 3.5H25.2a4 4 0 0 1-4-3.5L18 27z"
